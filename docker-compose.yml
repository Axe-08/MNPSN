services:
  node1:
    build: .
    container_name: mnpsn-node1
    environment:
      - NODE_ID=node-1
      - PORT=40001
      - RPC_PORT=8080
      - GENESIS_TIMESTAMP=${GENESIS_TIMESTAMP}
      - VRF_SECRET_KEY=${VRF_SECRET_KEY_1}
      - ANCHOR_CONTRACT_ADDRESS=${ANCHOR_CONTRACT_ADDRESS}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - RESUME_SLOT=${RESUME_SLOT}
    ports:
      - "40001:40001"
      - "8080:8080"
    networks:
      mnpsn_net:
        ipv4_address: 172.28.0.2

  node2:
    build: .
    container_name: mnpsn-node2
    environment:
      - NODE_ID=node-2
      - PORT=40002
      - RPC_PORT=8081
      - GENESIS_TIMESTAMP=${GENESIS_TIMESTAMP}
      - VRF_SECRET_KEY=${VRF_SECRET_KEY_2}
      - ANCHOR_CONTRACT_ADDRESS=${ANCHOR_CONTRACT_ADDRESS}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - RESUME_SLOT=${RESUME_SLOT}
    ports:
      - "40002:40002"
      - "8081:8081"
    depends_on:
      - node1
    networks:
      mnpsn_net:
        ipv4_address: 172.28.0.3

  node3:
    build: .
    container_name: mnpsn-node3
    environment:
      - NODE_ID=node-3
      - PORT=40003
      - RPC_PORT=8082
      - GENESIS_TIMESTAMP=${GENESIS_TIMESTAMP}
      - VRF_SECRET_KEY=${VRF_SECRET_KEY_3}
      - ANCHOR_CONTRACT_ADDRESS=${ANCHOR_CONTRACT_ADDRESS}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - RESUME_SLOT=${RESUME_SLOT}
    ports:
      - "40003:40003"
      - "8082:8082"
    depends_on:
      - node1
    networks:
      mnpsn_net:
        ipv4_address: 172.28.0.4

networks:
  mnpsn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
