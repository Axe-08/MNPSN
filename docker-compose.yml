services:
  node1:
    build: .
    container_name: mnpsn-node1
    network_mode: host
    environment:
      - NODE_ID=node-1
      - PORT=40001
      - RPC_PORT=8080
      - GENESIS_TIMESTAMP=${GENESIS_TIMESTAMP}
      - VRF_SECRET_KEY=${VRF_SECRET_KEY_1}
      - ANCHOR_CONTRACT_ADDRESS=${ANCHOR_CONTRACT_ADDRESS}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - RESUME_SLOT=${RESUME_SLOT}

  node2:
    build: .
    container_name: mnpsn-node2
    network_mode: host
    depends_on:
      - node1
    environment:
      - NODE_ID=node-2
      - PORT=40002
      - RPC_PORT=8081
      - GENESIS_TIMESTAMP=${GENESIS_TIMESTAMP}
      - VRF_SECRET_KEY=${VRF_SECRET_KEY_2}
      - ANCHOR_CONTRACT_ADDRESS=${ANCHOR_CONTRACT_ADDRESS}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - RESUME_SLOT=${RESUME_SLOT}

  node3:
    build: .
    container_name: mnpsn-node3
    network_mode: host
    depends_on:
      - node2
    environment:
      - NODE_ID=node-3
      - PORT=40003
      - RPC_PORT=8082
      - GENESIS_TIMESTAMP=${GENESIS_TIMESTAMP}
      - VRF_SECRET_KEY=${VRF_SECRET_KEY_3}
      - ANCHOR_CONTRACT_ADDRESS=${ANCHOR_CONTRACT_ADDRESS}
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL}
      - RESUME_SLOT=${RESUME_SLOT}
